services:
  minio:
    image: olake-minio-local:latest
    container_name: olake-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - olake-network

  polaris:
    image: apache/polaris:latest
    container_name: olake-polaris
    ports:
      - "8181:8181"
      - "8182:8182"
    environment:
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      POLARIS_BOOTSTRAP_CREDENTIALS: "POLARIS,root,${POLARIS_ROOT_SECRET}"
      polaris.realm-context.realms: POLARIS
      quarkus.otel.sdk.disabled: "true"
    networks:
      - olake-network
    depends_on:
      - minio
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 20s

volumes:
  minio_data:

networks:
  olake-network:
    external: true